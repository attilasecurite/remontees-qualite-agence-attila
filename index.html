<style>
  html,body{margin:0;height:100%;background:#C0392B}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F0EC}
</style>
</head>
<body>
<script>
  // Adresse /exec de la web app Apps Script (compte attilaqhse@gmail.com) — ne change pas tant qu'on garde le même déploiement
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbx0Xat5qVY4MyvDA9IQ18nBKkWAGRhtSjlXrrS6InmbQ1-CtFDxJ9FcvWAcZ3Kn3u462Q/exec';

  // (rien) → accueil + remontée · #commission → dashboard qualité · #audit → audit chantier · #audits → dashboard audits
  const PAGES = { '#commission': '', '#audit': '?p=audit', '#audits': '?p=audits' };
  const url = EXEC_URL + (location.hash in PAGES ? PAGES[location.hash] : '?p=saisie');
  const f = document.createElement('iframe');
  f.src = url;
  f.allow = 'camera; clipboard-write; geolocation';
  f.title = 'Remontées qualité agence ATTILA';
  document.body.appendChild(f);
  addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
